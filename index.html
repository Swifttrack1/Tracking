<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftTrack Logistics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f5f5f5;
    }
    .header {
      background-color: #003366;
      color: white;
      padding: 1.5rem;
      text-align: center;
    }
    .tracker {
      margin-top: 4rem;
    }
    .result-box {
      margin-top: 2rem;
      background-color: #ffffff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SwiftTrack Logistics</h1>
    <p>Fast. Reliable. Everywhere.</p>
  </div>

  <div class="container tracker">
    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <h3>Track Your Parcel</h3>
        <input type="text" id="trackingNumber" class="form-control my-3" placeholder="Enter tracking number">
        <button class="btn btn-primary" onclick="trackPackage()">Track</button>
        <div id="result" class="result-box d-none text-start"></div>
      </div>
    </div>
  </div>

  <script>
    function trackPackage() {
      const input = document.getElementById("trackingNumber").value.trim();
      const result = document.getElementById("result");

      if (!input) {
        alert("Please enter a tracking number.");
        return;
      }

      let trackingInfo = "";

      if (input === "SW123456789ZA") {
        trackingInfo = `
          <h5>Tracking Number: <span class="text-muted">${input}</span></h5>
          <ul>
            <li><strong>Status:</strong> Delivered</li>
            <li><strong>Delivered At:</strong> Cape Town, ZA</li>
            <li><strong>Date:</strong> 1 May 2025</li>
            <li><strong>Carrier:</strong> SwiftTrack Express</li>
          </ul>
        `;
      } else if (input === "SW987654321ZA") {
        trackingInfo = `
          <h5>Tracking Number: <span class="text-muted">${input}</span></h5>
          <ul>
            <li><strong>Status:</strong> In Transit</li>
            <li><strong>Last Location:</strong> Durban Facility</li>
            <li><strong>Estimated Delivery:</strong> 6 May 2025</li>
            <li><strong>Carrier:</strong> SwiftTrack Express</li>
          </ul>
        `;
      } else {
        trackingInfo = `
          <h5>Tracking Number: <span class="text-muted">${input}</span></h5>
          <p class="text-danger">No information available. Please check your tracking number and try again.</p>
        `;
      }

      result.classList.remove("d-none");
      result.innerHTML = trackingInfo;
    }
  </script>
</body>
</html>
