
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftTrack Logistics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f5f5f5;
    }
    .header {
      background-color: #003366;
      color: white;
      padding: 1.5rem;
      text-align: center;
    }
    .tracker {
      margin-top: 4rem;
    }
    .result-box {
      margin-top: 2rem;
      background-color: #ffffff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SwiftTrack Logistics</h1>
    <p>Fast. Reliable. Everywhere.</p>
  </div>

  <div class="container tracker">
    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <h3>Track Your Parcel</h3>
        <input type="text" id="trackingNumber" class="form-control my-3" placeholder="Enter tracking number">
        <button class="btn btn-primary" onclick="trackPackage()">Track</button>
        <div id="result" class="result-box d-none text-start"></div>
      </div>
    </div>
  </div>

  <script>
    function trackPackage() {
      const input = document.getElementById("trackingNumber").value;
      const result = document.getElementById("result");
      
      if (!input.trim()) {
        alert("Please enter a tracking number.");
        return;
      }

      result.classList.remove("d-none");
      result.innerHTML = `
        <h5>Tracking Number: <span class="text-muted">${input}</span></h5>
        <ul>
          <li><strong>Status:</strong> In Transit</li>
          <li><strong>Last Location:</strong> Johannesburg Hub</li>
          <li><strong>Estimated Delivery:</strong> 5 May 2025</li>
          <li><strong>Carrier:</strong> SwiftTrack Express</li>
        </ul>
      `;
    }
  </script>
</body>
</html>
